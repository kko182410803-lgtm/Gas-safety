    <style id="original-index-css">@import "tailwindcss";

@layer base {
  body {
    font-family: 'Noto Sans KR', sans-serif;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
}

.font-game {
  font-family: 'Jua', 'Noto Sans KR', sans-serif;
}

@keyframes floatSmoke {
  0% { transform: translateY(0px) scale(0.8); opacity: 0.8; }
  50% { transform: translateY(-15px) scale(1.1) translateX(5px); opacity: 0.6; }
  100% { transform: translateY(-30px) scale(1.4) translateX(-5px); opacity: 0; }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.7); }
  50% { box-shadow: 0 0 30px rgba(239, 68, 68, 1), 0 0 45px rgba(245, 158, 11, 0.8); }
}

@keyframes gentleBreeze {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(2deg) translateY(-2px); }
  100% { transform: rotate(0deg); }
}

@keyframes pendulumSwing {
  0% { transform: rotate(-12deg); }
  50% { transform: rotate(12deg); }
  100% { transform: rotate(-12deg); }
}

.animate-smoke {
  animation: floatSmoke 2s infinite ease-out;
}

.animate-hazard-glow {
  animation: pulseGlow 1.2s infinite;
}

.animate-breeze {
  animation: gentleBreeze 3s infinite ease-in-out;
}

.animate-pendulum {
  animation: pendulumSwing 2s infinite ease-in-out;
  transform-origin: top center;
}
</style>

  <body class="bg-slate-900 text-slate-100 select-none overflow-x-hidden font-sans">
    <div id="root"></div>
    <script id="embedded-sources" type="application/json">{"src/main.tsx": "import {StrictMode} from 'react';\nimport {createRoot} from 'react-dom/client';\nimport App from './App.tsx';\nimport './index.css';\n\ncreateRoot(document.getElementById('root')!).render(\n  <StrictMode>\n    <App />\n  </StrictMode>,\n);\n", "src/App.tsx": "import { useState, useEffect, useRef, useCallback } from 'react';\nimport { \n  GameMode, \n  GameStatus, \n  ActiveHazard, \n  HazardType, \n  Achievement, \n  UserStats \n} from './types';\nimport { KitchenScene } from './components/KitchenScene';\nimport { GameHUD } from './components/GameHUD';\nimport { PrologueModal } from './components/PrologueModal';\nimport { AchievementsModal } from './components/AchievementsModal';\nimport { GameOverModal } from './components/GameOverModal';\nimport { SafetyTipsModal } from './components/SafetyTipsModal';\nimport { storage } from './utils/storage';\nimport { soundManager } from './utils/audio';\nimport { \n  Flame, \n  Play, \n  BookOpen, \n  Trophy, \n  ShieldCheck, \n  Volume2, \n  VolumeX, \n  Mic, \n  MicOff, \n  Maximize2, \n  Smartphone,\n  Sparkles,\n  Award,\n  Lock,\n  RotateCcw,\n  AlertTriangle,\n  CheckCircle2\n} from 'lucide-react';\nimport { motion } from 'motion/react';\nimport confetti from 'canvas-confetti';\n\nconst TOTAL_GAME_TIME = 150; // 2분 30초 (150초)\nconst ALL_HAZARD_TYPES: HazardType[] = [\n  'valve',\n  'window',\n  'flammables',\n  'cleaning',\n  'old_valve_call',\n  'hose_kink',\n];\n\nexport default function App() {\n  // Game states\n  const [mode, setMode] = useState<GameMode>('menu');\n  const [status, setStatus] = useState<GameStatus>('idle');\n  const [score, setScore] = useState<number>(0);\n  const [timeLeft, setTimeLeft] = useState<number>(TOTAL_GAME_TIME);\n  const [combo, setCombo] = useState<number>(0);\n  const [hazardsClearedCount, setHazardsClearedCount] = useState<number>(0);\n  const [activeHazards, setActiveHazards] = useState<ActiveHazard[]>([]);\n  \n  // Storage & Modal states\n  const [stats, setStats] = useState<UserStats>(storage.getStats());\n  const [achievements, setAchievements] = useState<Achievement[]>(storage.getAchievements());\n  const [newlyUnlocked, setNewlyUnlocked] = useState<Achievement[]>([]);\n\n  // Modals\n  const [isPrologueOpen, setIsPrologueOpen] = useState(false);\n  const [prologueResetKey, setPrologueResetKey] = useState(0);\n  const [isAchievementsOpen, setIsAchievementsOpen] = useState(false);\n  const [isSafetyTipsOpen, setIsSafetyTipsOpen] = useState(false);\n  const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);\n  const [resetToast, setResetToast] = useState(false);\n  \n  // Audio & Display\n  const [soundEnabled, setSoundEnabled] = useState(true);\n  const [voiceEnabled, setVoiceEnabled] = useState(true);\n  const [isFullscreen, setIsFullscreen] = useState(false);\n  const [isMobileDevice, setIsMobileDevice] = useState(() => {\n    if (typeof window === 'undefined') return false;\n    return window.innerWidth <= 768 && ('ontouchstart' in window || navigator.maxTouchPoints > 0);\n  });\n  const [isMobileLayout, setIsMobileLayout] = useState(false);\n  const [mobileNoticeDismissed, setMobileNoticeDismissed] = useState(false);\n  const [floatingScore, setFloatingScore] = useState<{ value: number; id: number } | null>(null);\n  const [dishclothSelected, setDishclothSelected] = useState(false);\n\n  const containerRef = useRef<HTMLDivElement>(null);\n  const respawnCooldownTimer = useRef<number>(0);\n\n  // Sync audio toggles\n  useEffect(() => {\n    soundManager.soundEnabled = soundEnabled;\n  }, [soundEnabled]);\n\n  useEffect(() => {\n    soundManager.voiceEnabled = voiceEnabled;\n  }, [voiceEnabled]);\n\n  // Fullscreen toggle\n  const toggleFullscreen = async () => {\n    try {\n      if (document.fullscreenElement) {\n        if (document.exitFullscreen) await document.exitFullscreen();\n        setIsFullscreen(false);\n        return;\n      }\n\n      const target = containerRef.current || document.documentElement;\n      const request = target.requestFullscreen || document.documentElement.requestFullscreen;\n      if (request) {\n        await request.call(target);\n        setIsFullscreen(true);\n      } else {\n        setIsFullscreen(true);\n      }\n    } catch (err) {\n      setIsFullscreen(prev => !prev);\n    }\n  };\n\n  useEffect(() => {\n    const syncFullscreenState = () => {\n      setIsFullscreen(!!document.fullscreenElement);\n    };\n    document.addEventListener('fullscreenchange', syncFullscreenState);\n    return () => document.removeEventListener('fullscreenchange', syncFullscreenState);\n  }, []);\n\n  // Detect a phone/tablet without changing the desktop default layout.\n  useEffect(() => {\n    const updateDeviceType = () => {\n      const mobile = window.innerWidth <= 768 && ('ontouchstart' in window || navigator.maxTouchPoints > 0);\n      setIsMobileDevice(mobile);\n    };\n    window.addEventListener('resize', updateDeviceType);\n    updateDeviceType();\n    return () => window.removeEventListener('resize', updateDeviceType);\n  }, []);\n\n  // Helper to spawn a new hazard\n  const spawnHazard = useCallback((currentList: ActiveHazard[], selectedMode: GameMode): ActiveHazard[] => {\n    if (currentList.length >= 3) return currentList; // Max 3 simultaneous hazards\n\n    // Find unused hazard types\n    const activeTypes = new Set(currentList.map(h => h.type));\n    const availableTypes = ALL_HAZARD_TYPES.filter(t => !activeTypes.has(t));\n    if (availableTypes.length === 0) return currentList;\n\n    const randomType = availableTypes[Math.floor(Math.random() * availableTypes.length)];\n    const timeLimit = selectedMode === 'hard' ? 5.5 : 9.0;\n\n    soundManager.playHazardWarning();\n\n    const newHazard: ActiveHazard = {\n      id: `${randomType}-${Date.now()}-${Math.random()}`,\n      type: randomType,\n      timeLeft: timeLimit,\n      totalTime: timeLimit,\n      spawnedAt: Date.now(),\n      flammablesCount: randomType === 'flammables' ? 4 : undefined,\n      windowClickCount: randomType === 'window' ? 2 : undefined,\n    };\n\n    return [...currentList, newHazard];\n  }, []);\n\n  // Start a new game\n  const startGame = useCallback((chosenMode: 'normal' | 'hard') => {\n    setMode(chosenMode);\n    setStatus('playing');\n    setScore(0);\n    setTimeLeft(TOTAL_GAME_TIME);\n    setCombo(0);\n    setHazardsClearedCount(0);\n    setNewlyUnlocked([]);\n    setDishclothSelected(false);\n    respawnCooldownTimer.current = 0;\n\n    // Spawn initial hazards\n    let initialList = spawnHazard([], chosenMode);\n    if (chosenMode === 'hard') {\n      initialList = spawnHazard(initialList, chosenMode);\n      initialList = spawnHazard(initialList, chosenMode);\n    }\n    setActiveHazards(initialList);\n  }, [spawnHazard]);\n\n  // End Game (Clear or Game Over)\n  const handleEndGame = useCallback((finalStatus: 'victory' | 'gameover', currentScore: number, clearedHazards: number, currentMode: GameMode) => {\n    setStatus(finalStatus);\n    setActiveHazards([]);\n\n    if (finalStatus === 'victory') {\n      soundManager.playVictory();\n      try {\n        confetti({\n          particleCount: 120,\n          spread: 80,\n          origin: { y: 0.6 },\n        });\n      } catch {\n        // ignore\n      }\n    } else {\n      soundManager.playFailure();\n    }\n\n    if (currentMode === 'normal' || currentMode === 'hard') {\n      const result = storage.checkGameAchievements(\n        currentMode,\n        currentScore,\n        finalStatus === 'victory',\n        clearedHazards\n      );\n      setStats(result.updatedStats);\n      setAchievements(storage.getAchievements());\n      if (result.newlyUnlocked.length > 0) {\n        setNewlyUnlocked(result.newlyUnlocked);\n        soundManager.playAchievement();\n      }\n    }\n  }, []);\n\n  // Main Tick Game Loop\n  useEffect(() => {\n    if (status !== 'playing') return;\n\n    const interval = setInterval(() => {\n      // 1. Decrement overall time left (2:30 countdown)\n      setTimeLeft((prevTime) => {\n        const nextTime = Math.max(0, prevTime - 0.1);\n        if (nextTime <= 0) {\n          handleEndGame('victory', score, hazardsClearedCount, mode);\n        }\n        return nextTime;\n      });\n\n      // 2. Process active hazards timers\n      setActiveHazards((prevHazards) => {\n        let scorePenalty = 0;\n        let comboBroken = false;\n        const updatedList: ActiveHazard[] = [];\n\n        prevHazards.forEach((hazard) => {\n          const nextHazardTime = hazard.timeLeft - 0.1;\n          if (nextHazardTime <= 0) {\n            // Hazard Timed Out! -100 points\n            scorePenalty -= 100;\n            comboBroken = true;\n            soundManager.playFailure();\n          } else {\n            updatedList.push({\n              ...hazard,\n              timeLeft: nextHazardTime,\n            });\n          }\n        });\n\n        if (scorePenalty < 0) {\n          setScore((s) => {\n            const nextScore = s + scorePenalty;\n            setFloatingScore({ value: scorePenalty, id: Date.now() });\n            // Check Game Over Condition: -300 points or lower!\n            if (nextScore <= -300) {\n              setTimeout(() => {\n                handleEndGame('gameover', nextScore, hazardsClearedCount, mode);\n              }, 100);\n            }\n            return nextScore;\n          });\n        }\n\n        if (comboBroken) {\n          setCombo(0);\n        }\n\n        // 3. Hazard Spawner logic (normal is relaxed, hard is fast)\n        const respawnInterval = mode === 'hard' ? 0.8 : 3.5;\n        respawnCooldownTimer.current += 0.1;\n\n        if (updatedList.length < 3 && respawnCooldownTimer.current >= respawnInterval) {\n          respawnCooldownTimer.current = 0;\n          return spawnHazard(updatedList, mode);\n        }\n\n        return updatedList;\n      });\n    }, 100);\n\n    return () => clearInterval(interval);\n  }, [status, mode, score, hazardsClearedCount, spawnHazard, handleEndGame]);\n\n  // Handle Hazard Interaction from Scene Click\n  const handleHazardInteract = (hazardType: HazardType) => {\n    if (status !== 'playing') return;\n\n    const targetHazard = activeHazards.find(h => h.type === hazardType);\n    if (!targetHazard) return;\n\n    // Special sound cues by type\n    if (hazardType === 'valve') soundManager.playValveTurn();\n    else if (hazardType === 'window') soundManager.playWindowWhoosh();\n    else if (hazardType === 'cleaning') soundManager.playWipe();\n    else if (hazardType === 'old_valve_call') soundManager.playPhoneCall();\n    else soundManager.playSuccess(combo + 1);\n\n    // Reward points (+100)\n    const pointsGained = 100;\n    setScore(s => s + pointsGained);\n    setFloatingScore({ value: pointsGained, id: Date.now() });\n    setCombo(c => c + 1);\n    setHazardsClearedCount(h => h + 1);\n    if (hazardType === 'cleaning') setDishclothSelected(false);\n\n    // Remove cleared hazard\n    setActiveHazards(prev => {\n      const remaining = prev.filter(h => h.id !== targetHazard.id);\n      return remaining;\n    });\n\n    // Replenishment delay when one is cleared (relaxed on normal mode, fast on hard mode)\n    const instantRespawnDelay = mode === 'hard' ? 250 : 1500;\n    setTimeout(() => {\n      setActiveHazards(currentList => {\n        if (currentList.length < 3) {\n          return spawnHazard(currentList, mode);\n        }\n        return currentList;\n      });\n    }, instantRespawnDelay);\n\n    // Reset respawn timer\n    respawnCooldownTimer.current = 0;\n  };\n\n  // Prologue completed callback\n  const handlePrologueFinished = () => {\n    const result = storage.incrementPrologueClear();\n    setStats(storage.getStats());\n    setAchievements(storage.getAchievements());\n    if (result.newlyUnlocked.length > 0) {\n      setNewlyUnlocked(result.newlyUnlocked);\n      soundManager.playAchievement();\n    }\n  };\n\n  // Reset entire game progress\n  const handleConfirmReset = () => {\n    const fresh = storage.resetAllGameData();\n    setStats(fresh.stats);\n    setAchievements(fresh.achievements);\n    setScore(0);\n    setCombo(0);\n    setHazardsClearedCount(0);\n    setActiveHazards([]);\n    setStatus('idle');\n    setMode('menu');\n    setPrologueResetKey(k => k + 1);\n    setIsPrologueOpen(true);\n    setIsResetConfirmOpen(false);\n    setResetToast(true);\n    setTimeout(() => setResetToast(false), 3000);\n  };\n\n  return (\n    <div\n      ref={containerRef}\n      className={`min-h-screen w-full bg-slate-950 text-slate-100 flex flex-col items-center justify-center select-none font-sans ${isFullscreen ? 'fixed inset-0 z-[9999] p-0 overflow-hidden' : (isMobileLayout ? 'p-0 overflow-hidden' : 'p-2 sm:p-4 md:p-6')}`}\n    >\n      {/* Phone warning overlay. Desktop remains the default experience. */}\n      {isMobileDevice && !mobileNoticeDismissed && (\n        <div className=\"fixed inset-0 z-[100] bg-slate-950/95 backdrop-blur-sm flex items-center justify-center p-5\">\n          <div className=\"w-full max-w-md rounded-3xl border-2 border-amber-400/70 bg-slate-900 p-6 text-center shadow-2xl\">\n            <div className=\"mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-amber-500/15 border border-amber-400/40\">\n              <Smartphone className=\"h-7 w-7 text-amber-300\" />\n            </div>\n            <h2 className=\"font-game text-2xl text-white\">휴대폰으로 접속하셨습니다</h2>\n            <p className=\"mt-3 text-sm leading-6 text-slate-300\">\n              기본 게임 화면은 컴퓨터 기준입니다.<br />\n              휴대폰에서는 아래 버튼을 눌러 휴대폰 화면에 맞게 전환해 주세요.\n            </p>\n            <button\n              onClick={() => {\n                setIsMobileLayout(true);\n                setMobileNoticeDismissed(true);\n              }}\n              className=\"mt-6 w-full rounded-2xl bg-amber-500 px-5 py-3 font-black text-slate-950 transition hover:bg-amber-400 active:scale-[0.98]\"\n            >\n              휴대폰 화면으로 플레이하기\n            </button>\n          </div>\n        </div>\n      )}\n\n      {/* 1080p Landscape Optimized Frame */}\n      <main className={`w-full bg-slate-900 border-4 border-slate-700/80 shadow-2xl overflow-hidden flex flex-col relative ${isFullscreen ? 'max-w-none w-full h-full min-h-0 max-h-none aspect-auto rounded-none border-0 p-2' : (isMobileLayout ? 'max-w-none h-[100dvh] min-h-0 max-h-none aspect-auto rounded-none border-0 p-2' : 'max-w-[1500px] aspect-[16/9] min-h-[560px] max-h-[92vh] rounded-3xl p-3 md:p-5')}`}>\n        \n        {/* VIEW 1: MAIN MENU */}\n        {mode === 'menu' && (\n          <div className=\"w-full h-full flex flex-col justify-between items-center text-center relative overflow-hidden py-4 px-2\">\n            \n            {/* Background Decorative Aura */}\n            <div className=\"absolute -top-32 -left-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none\" />\n            <div className=\"absolute -bottom-32 -right-32 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none\" />\n\n            {/* Top Bar Controls */}\n            <div className=\"w-full flex items-center justify-between z-10 px-2\">\n              <div className=\"flex items-center gap-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 text-xs text-amber-400 font-bold\">\n                <ShieldCheck className=\"w-4 h-4 text-emerald-400\" />\n                가스안전 체험교실\n              </div>\n\n              <div className=\"flex items-center gap-1.5\">\n                <button\n                  id=\"btn-sound-toggle\"\n                  onClick={() => setSoundEnabled(!soundEnabled)}\n                  title=\"효과음 켜기/끄기\"\n                  aria-label=\"효과음 켜기/끄기\"\n                  className=\"p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 transition border border-slate-700\"\n                >\n                  {soundEnabled ? <Volume2 className=\"w-4 h-4 text-emerald-400\" /> : <VolumeX className=\"w-4 h-4 text-slate-500\" />}\n                </button>\n\n                <button\n                  id=\"btn-voice-toggle\"\n                  onClick={() => setVoiceEnabled(!voiceEnabled)}\n                  title=\"음성 나레이션 켜기/끄기\"\n                  aria-label=\"음성 나레이션 켜기/끄기\"\n                  className=\"p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 transition border border-slate-700\"\n                >\n                  {voiceEnabled ? <Mic className=\"w-4 h-4 text-indigo-400\" /> : <MicOff className=\"w-4 h-4 text-slate-500\" />}\n                </button>\n\n                <button\n                  id=\"btn-mobile-layout-toggle\"\n                  onClick={() => setIsMobileLayout(!isMobileLayout)}\n                  title=\"휴대폰 화면 맞춤\"\n                  aria-label=\"휴대폰 화면 맞춤\"\n                  className={`p-2 rounded-xl text-slate-300 transition border border-slate-700 ${isMobileLayout ? 'bg-indigo-700/80 hover:bg-indigo-600/80' : 'bg-slate-800 hover:bg-slate-700'}`}\n                >\n                  <Smartphone className={`w-4 h-4 ${isMobileLayout ? 'text-white' : 'text-sky-400'}`} />\n                </button>\n\n                <button\n                  id=\"btn-fullscreen-toggle\"\n                  onClick={toggleFullscreen}\n                  title={isFullscreen ? \"전체화면 종료\" : \"전체화면 모드\"}\n                  aria-label={isFullscreen ? \"전체화면 종료\" : \"전체화면 모드\"}\n                  className=\"p-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-slate-300 transition border border-slate-700\"\n                >\n                  <Maximize2 className={`w-4 h-4 ${isFullscreen ? 'text-emerald-400' : 'text-amber-400'}`} />\n                </button>\n\n                {/* 전체 초기화 버튼 */}\n                <button\n                  id=\"btn-reset-game-all\"\n                  onClick={() => setIsResetConfirmOpen(true)}\n                  title=\"게임 전체 초기화\"\n                  aria-label=\"게임 전체 초기화\"\n                  className=\"px-3 py-2 bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-800/80 rounded-xl text-xs font-bold transition flex items-center gap-1 shadow-sm\"\n                >\n                  <RotateCcw className=\"w-3.5 h-3.5\" />\n                  <span>전체 초기화</span>\n                </button>\n              </div>\n            </div>\n\n            {/* Center Hero Title */}\n            <div className=\"space-y-2 z-10 my-auto\">\n              <motion.div\n                initial={{ scale: 0.9, opacity: 0 }}\n                animate={{ scale: 1, opacity: 1 }}\n                transition={{ duration: 0.5 }}\n                className=\"flex items-center justify-center gap-3\"\n              >\n                <div className=\"p-3 bg-gradient-to-tr from-amber-500 to-red-500 rounded-3xl shadow-xl\">\n                  <Flame className=\"w-10 h-10 md:w-12 md:h-12 text-white animate-pulse\" />\n                </div>\n                <h1 className=\"text-3xl md:text-5xl lg:text-6xl font-black font-game tracking-tight bg-gradient-to-r from-amber-300 via-orange-300 to-amber-100 bg-clip-text text-transparent\">\n                  가스 안전 지키기\n                </h1>\n              </motion.div>\n\n              <p className=\"text-xs md:text-base text-slate-300 font-medium max-w-2xl mx-auto leading-relaxed\">\n                창문 환기, 가스 밸브 잠그기, 가연물 치우기 등 실생활 가스 안전 수칙을 지켜 집을 수호하세요!<br />\n                <span className=\"text-amber-400 font-bold\">플레이타임 2분 30초</span> 동안 안전 점수를 획득하고 도전과제를 달성해보세요.\n              </p>\n            </div>\n\n            {/* Main Action Buttons Grid */}\n            <div className=\"w-full max-w-4xl grid grid-cols-1 sm:grid-cols-3 gap-3 md:gap-4 z-10\">\n              \n              {/* Button 1: Prologue / Educational Mode */}\n              <button\n                id=\"btn-main-prologue\"\n                onClick={() => setIsPrologueOpen(true)}\n ices of removed items (0..3)\n\n  const [phoneCalling, setPhoneCalling] = useState(false);\n  const [phoneConnectedToast, setPhoneConnectedToast] = useState(false);\n\n  const [wipingSpot, setWipingSpot] = useState(false);\n  const [dishclothNeedPrompt, setDishclothNeedPrompt] = useState(false);\n\n  const [hoseDragX, setHoseDragX] = useState(0);\n  const [hoseDiscarded, setHoseDiscarded] = useState(false);\n\n  const valveRef = useRef<HTMLDivElement>(null);\n\n  const getHazard = (type: HazardType) => activeHazards.find(h => h.type === type);\n\n  const valveHazard = getHazard('valve');\n  const windowHazard = getHazard('window');\n  const flammablesHazard = getHazard('flammables');\n  const cleaningHazard = getHazard('cleaning');\n  const oldValveHazard = getHazard('old_valve_call');\n  const hoseHazard = getHazard('hose_kink');\n\n  const isTargeted = (type: HazardType) => {\n    if (isPrologue) return highlightedHazard === type;\n    return !!getHazard(type);\n  };\n\n  // Reset local state when hazard spawns or disappears\n  useEffect(() => {\n    if (!valveHazard && (!isPrologue || highlightedHazard !== 'valve')) {\n      setValveAngle(90); // Safe state\n    } else {\n      setValveAngle(0); // Open/Dangerous state\n    }\n  }, [valveHazard, isPrologue, highlightedHazard]);\n\n  useEffect(() => {\n    if (!windowHazard && (!isPrologue || highlightedHazard !== 'window')) {\n      setWindowClicks(0);\n    }\n  }, [windowHazard, isPrologue, highlightedHazard]);\n\n  useEffect(() => {\n    if (!flammablesHazard && (!isPrologue || highlightedHazard !== 'flammables')) {\n      setFlammablesRemoved([]);\n    }\n  }, [flammablesHazard, isPrologue, highlightedHazard]);\n\n  useEffect(() => {\n    if (!hoseHazard && (!isPrologue || highlightedHazard !== 'hose_kink')) {\n      setHoseDiscarded(false);\n      setHoseDragX(0);\n    }\n  }, [hoseHazard, isPrologue, highlightedHazard]);\n\n  // 1. Valve Rotation Handler (Must turn 90 degrees to lock)\n  const handleValveRotateStart = (e: React.PointerEvent) => {\n    if (!isTargeted('valve')) return;\n    setIsDraggingValve(true);\n    (e.target as HTMLElement).setPointerCapture(e.pointerId);\n  };\n\n  const handleValveRotateMove = (e: React.PointerEvent) => {\n    if (!isDraggingValve || !isTargeted('valve') || !valveRef.current) return;\n    const rect = valveRef.current.getBoundingClientRect();\n    const centerX = rect.left + rect.width / 2;\n    const centerY = rect.top + rect.height / 2;\n\n    const dx = e.clientX - centerX;\n    const dy = e.clientY - centerY;\n\n    // Angle relative to vertical (0 deg) to horizontal (90 deg)\n    let deg = Math.atan2(dx, -dy) * (180 / Math.PI);\n    if (deg < 0) deg = 0;\n    if (deg > 90) deg = 90;\n\n    setValveAngle(deg);\n\n    if (deg >= 85) {\n      // Snapped to 90 deg! Closed successfully!\n      setIsDraggingValve(false);\n      setValveAngle(90);\n      onInteract('valve');\n    }\n  };\n\n  const handleValveRotateEnd = (e: React.PointerEvent) => {\n    if (!isDraggingValve) return;\n    setIsDraggingValve(false);\n    try {\n      (e.target as HTMLElement).releasePointerCapture(e.pointerId);\n    } catch {\n      // ignore\n    }\n    if (valveAngle < 85 && isTargeted('valve')) {\n      // Spring back to 0 if not fully rotated 90 degrees\n      setValveAngle(0);\n    }\n  };\n\n  // 2. Window Handler (Requires 2 clicks to fully open)\n  const handleWindowClick = () => {\n    if (!isTargeted('window')) return;\n    const nextClicks = windowClicks + 1;\n    setWindowClicks(nextClicks);\n\n    if (nextClicks >= 2) {\n      onInteract('window');\n    }\n  };\n\n  // 3. Flammables Handler (Requires 4 clicks to remove all 4 items)\n  const handleRemoveFlammableItem = (index: number, e: React.MouseEvent) => {\n    e.stopPropagation();\n    if (!isTargeted('flammables')) return;\n    if (flammablesRemoved.includes(index)) return;\n\n    const updated = [...flammablesRemoved, index];\n    setFlammablesRemoved(updated);\n\n    if (updated.length >= 4) {\n      // All 4 removed!\n      setFlammablesRemoved([]);\n      onInteract('flammables');\n    }\n  };\n\n  // 4. Cleaning Handler (Requires dishcloth selected)\n  const handleCleaningClick = () => {\n    if (cleaningDishclothSelected) {\n      setWipingSpot(true);\n      setTimeout(() => setWipingSpot(false), 800);\n      onInteract('cleaning');\n    } else {\n      setDishclothNeedPrompt(true);\n      setTimeout(() => setDishclothNeedPrompt(false), 1500);\n    }\n  };\n\n  // 5. Phone Call Handler (Non-blocking: connects after 1 second while allowing other actions)\n  const handlePhoneClick = () => {\n    if (!isTargeted('old_valve_call') || phoneCalling) return;\n    setPhoneCalling(true);\n\n    // Call connects in background after 1.0s (1000ms) without blocking other gameplay\n    setTimeout(() => {\n      setPhoneCalling(false);\n      setPhoneConnectedToast(true);\n      setTimeout(() => setPhoneConnectedToast(false), 2000);\n      onInteract('old_valve_call');\n    }, 1000);\n  };\n\n  // 6. Hose Drag Handler (Drag damaged hose to discard)\n  const handleHoseDragEnd = (_: any, info: any) => {\n    if (!isTargeted('hose_kink')) return;\n    if (info.offset.x > 60) {\n      setHoseDiscarded(true);\n      setHoseDragX(100);\n      setTimeout(() => {\n        onInteract('hose_kink');\n        setHoseDiscarded(false);\n        setHoseDragX(0);\n      }, 400);\n    } else {\n      setHoseDragX(0);\n    }\n  };\n\n  return (\n    <div className=\"relative w-full h-full bg-gradient-to-b from-amber-50 to-slate-100 rounded-3xl overflow-hidden shadow-2xl border-4 border-slate-700/30 select-none\">\n      \n      {/* 1. ROOM BACKGROUND: Wall, Clock with Pendulum & Hands, and Safety Poster */}\n      <div className=\"absolute inset-0 pointer-events-none\">\n        {/* Upper Wall */}\n        <div className=\"h-[58%] w-full bg-gradient-to-b from-amber-100/90 via-orange-50/70 to-amber-50 relative\">\n          {/* Subtle Grid Tile Pattern */}\n          <     actionInstruction: '손상되거나 눌린 호스를 드래그하여 안전하게 버리고 교체하세요',\n    reason: '호스가 눌리거나 꺾이면 미세 균열이 생겨 가스가 샐 수 있기 때문',\n    locationDescription: '가스레인지 하단 연결 호스',\n    educationalTip: '가스 호스는 꺾이거나 무거운 물건에 눌리지 않아야 하며, 비눗물 거품 점검으로 미세 누출을 정기 점검해야 합니다.',\n    iconName: 'Zap',\n    color: 'from-yellow-500 to-orange-600',\n  },\n};\n\nexport const PROLOGUE_STEPS = [\n  {\n    hazardType: 'valve' as HazardType,\n    title: '1단계: 가스 밸브 90도 돌려 잠그기',\n    characterDialogue: '\"가스를 사용한 뒤에는 퓨즈콕 밸브를 90도 돌려 꼭 잠가야 해! 가스 누출을 원천 차단해 준단다.\"',\n    guideText: '화면의 [가스 밸브] 손잡이를 90도 돌려서 밸브를 안전하게 잠가보세요!',\n  },\n  {\n    hazardType: 'window' as HazardType,\n    title: '2단계: 창문 2번 열어 환기하기',\n    characterDialogue: '\"혹시 가스 냄새가 나면 전기 스위치 대신 창문을 활짝 열어야 해! 창문을 2번 눌러 신선한 바람으로 환기시켜보자.\"',\n    guideText: '싱크대 위 [창문]을 2번 연속으로 터치하여 활짝 열어보세요!',\n  },\n  {\n    hazardType: 'flammables' as HazardType,\n    title: '3단계: 가연물 4가지 치우기',\n    characterDialogue: '\"가스레인지 근처에 있는 휴지, 스프레이, 종이박스 등 가연물 4가지를 터치해 안전한 곳으로 모두 치워주자!\"',\n    guideText: '가스레인지 주변의 [위험한 물건 4개]를 차례대로 터치하여 치워보세요!',\n  },\n  {\n    hazardType: 'cleaning' as HazardType,\n    title: '4단계: 가스레인지 기름때 청소하기',\n    characterDialogue: '\"버너 주변에 기름때가 쌓여 있으면 화재의 원인이 돼! 싱크대의 행주를 든 다음 기름때를 닦아주자.\"',\n    guideText: '1. 싱크대의 [항균 행주] 터치 ➔ 2. 버너 주변 [기름때]를 터치하여 깨끗하게 청소하세요!',\n  },\n  {\n    hazardType: 'old_valve_call' as HazardType,\n    title: '5단계: 노후 밸브 전문가에게 전화하기',\n    characterDialogue: '\"오래된 가스 밸브는 위험해! 스마트폰을 눌러 전문가에게 점검 전화를 걸면 1초 후 자동으로 연결된단다.\"',\n    guideText: '싱크대 위 [스마트폰]을 터치해보세요! 1초 후 통화가 연결되며 다른 활동도 바로 할 수 있어요.',\n  },\n  {\n    hazardType: 'hose_kink' as HazardType,\n    title: '6단계: 손상된 가스 호스 드래그하여 버리기',\n    characterDialogue: '\"꺾이거나 손상된 가스 호스는 매우 위험해! 호스를 옆으로 드래그해서 안전하게 버리고 새것으로 펴주자.\"',\n    guideText: '하단의 [손상된 호스]를 옆(휴지통 방향)으로 드래그하여 안전하게 버려보세요!',\n  },\n];\n", "src/utils/audio.ts": "// Web Audio API Sound Synthesizer & Speech Narration\n\nclass SoundManager {\n  private ctx: AudioContext | null = null;\n  public soundEnabled: boolean = true;\n  public voiceEnabled: boolean = true;\n\n  private initCtx() {\n    if (!this.ctx && typeof window !== 'undefined') {\n      const AudioCtxClass = window.AudioContext || (window as unknown as { webkitAudioContext: typeof AudioContext }).webkitAudioContext;\n      if (AudioCtxClass) {\n        this.ctx = new AudioCtxClass();\n      }\n    }\n    if (this.ctx && this.ctx.state === 'suspended') {\n      this.ctx.resume();\n    }\n  }\n\n  // Play a pleasant success chime for solving a hazard\n  playSuccess(combo: number = 1) {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n\n    const baseFreq = 523.25; // C5\n    const pitchMultiplier = Math.min(1.5, 1 + (combo - 1) * 0.08);\n    const now = this.ctx.currentTime;\n\n    const osc = this.ctx.createOscillator();\n    const gain = this.ctx.createGain();\n\n    osc.type = 'triangle';\n    osc.frequency.setValueAtTime(baseFreq * pitchMultiplier, now);\n    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5 * pitchMultiplier, now + 0.15);\n\n    gain.gain.setValueAtTime(0.3, now);\n    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);\n\n    osc.connect(gain);\n    gain.connect(this.ctx.destination);\n\n    osc.start(now);\n    osc.stop(now + 0.3);\n\n    // Add bright harmonic sparkle\n    const sparkleOsc = this.ctx.createOscillator();\n    const sparkleGain = this.ctx.createGain();\n    sparkleOsc.type = 'sine';\n    sparkleOsc.frequency.setValueAtTime(1046.5 * pitchMultiplier, now + 0.05);\n    sparkleOsc.frequency.exponentialRampToValueAtTime(1318.5 * pitchMultiplier, now + 0.25);\n    sparkleGain.gain.setValueAtTime(0.2, now + 0.05);\n    sparkleGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);\n\n    sparkleOsc.connect(sparkleGain);\n    sparkleGain.connect(this.ctx.destination);\n    sparkleOsc.start(now + 0.05);\n    sparkleOsc.stop(now + 0.3);\n  }\n\n  // Hazard valve turning lock sound\n  playValveTurn() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    // Metallic heavy click\n    const osc = this.ctx.createOscillator();\n    const gain = this.ctx.createGain();\n    osc.type = 'square';\n    osc.frequency.setValueAtTime(180, now);\n    osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);\n    gain.gain.setValueAtTime(0.4, now);\n    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);\n    osc.connect(gain);\n    gain.connect(this.ctx.destination);\n    osc.start(now);\n    osc.stop(now + 0.12);\n  }\n\n  // Window opening whoosh\n  playWindowWhoosh() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    const bufferSize = this.ctx.sampleRate * 0.25;\n    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);\n    const data = buffer.getChannelData(0);\n    for (let i = 0; i < bufferSize; i++) {\n      data[i] = Math.random() * 2 - 1;\n    }\n    const noise = this.ctx.createBufferSource();\n    noise.buffer = buffer;\n\n    const filter = this.ctx.createBiquadFilter();\n    filter.type = 'bandpass';\n    filter.frequency.setValueAtTime(400, now);\n    filter.frequency.exponentialRampToValueAtTime(1200, now + 0.2);\n\n    const gain = this.ctx.createGain();\n    gain.gain.setValueAtTime(0.25, now);\n    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);\n\n    noise.connect(filter);\n    filter.connect(gain);\n    gain.connect(this.ctx.destination);\n    noise.start(now);\n    noise.stop(now + 0.25);\n  }\n\n  // Wipe / Sponge squeak\n  playWipe() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    const osc = this.ctx.createOscillator();\n    const gain = this.ctx.createGain();\n    osc.type = 'sine';\n    osc.frequency.setValueAtTime(900, now);\n    osc.frequency.linearRampToValueAtTime(1400, now + 0.08);\n    osc.frequency.linearRampToValueAtTime(1100, now + 0.16);\n\n    gain.gain.setValueAtTime(0.2, now);\n    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);\n\n    osc.connect(gain);\n    gain.connect(this.ctx.destination);\n    osc.start(now);\n    osc.stop(now + 0.2);\n  }\n\n  // Phone dial & connect chime\n  playPhoneCall() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    // Dual Tone Multi-Frequency DTMF simulation\n    const freqs = [697, 1209];\n    freqs.forEach(f => {\n      const osc = this.ctx!.createOscillator();\n      const gain = this.ctx!.createGain();\n      osc.type = 'sine';\n      osc.frequency.value = f;\n      gain.gain.setValueAtTime(0.15, now);\n      gain.gain.setValueAtTime(0.15, now + 0.15);\n      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);\n      osc.connect(gain);\n      gain.connect(this.ctx!.destination);\n      osc.start(now);\n      osc.stop(now + 0.2);\n    });\n  }\n\n  // Failure warning buzzer (-100 pts)\n  playFailure() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    const osc = this.ctx.createOscillator();\n    const gain = this.ctx.createGain();\n    osc.type = 'sawtooth';\n    osc.frequency.setValueAtTime(140, now);\n    osc.frequency.setValueAtTime(110, now + 0.15);\n\n    gain.gain.setValueAtTime(0.35, now);\n    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);\n\n    osc.connect(gain);\n    gain.connect(this.ctx.destination);\n    osc.start(now);\n    osc.stop(now + 0.35);\n  }\n\n  // Gas hiss alarm sound for hazard emergence\n  playHazardWarning() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    const osc = this.ctx.createOscillator();\n    const gain = this.ctx.createGain();\n    osc.type = 'triangle';\n    osc.frequency.setValueAtTime(880, now);\n    osc.frequency.setValueAtTime(440, now + 0.1);\n\n    gain.gain.setValueAtTime(0.15, now);\n    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);\n\n    osc.connect(gain);\n    gain.connect(this.ctx.destination);\n    osc.start(now);\n    osc.stop(now + 0.2);\n  }\n\n  // Victory fanfare\n  playVictory() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    const melody = [\n      { note: 523.25, time: 0, dur: 0.15 },    // C5\n      { note: 659.25, time: 0.15, dur: 0.15 }, // E5\n      { note: 783.99, time: 0.3, dur: 0.15 },  // G5\n      { note: 1046.5, time: 0.45, dur: 0.4 },  // C6\n    ];\n\n    melody.forEach(m => {\n      const osc = this.ctx!.createOscillator();\n      const gain = this.ctx!.createGain();\n      osc.type = 'triangle';\n      osc.frequency.setValueAtTime(m.note, now + m.time);\n      gain.gain.setValueAtTime(0.25, now + m.time);\n      gain.gain.exponentialRampToValueAtTime(0.01, now + m.time + m.dur);\n      osc.connect(gain);\n      gain.connect(this.ctx!.destination);\n      osc.start(now + m.time);\n      osc.stop(now + m.time + m.dur);\n    });\n  }\n\n  // Achievement unlock bell\n  playAchievement() {\n    if (!this.soundEnabled) return;\n    this.initCtx();\n    if (!this.ctx) return;\n    const now = this.ctx.currentTime;\n\n    [784, 987.77, 1174.66, 1567.98].forEach((freq, idx) => {\n      const osc = this.ctx!.createOscillator();\n      const gain = this.ctx!.createGain();\n      osc.type = 'sine';\n      osc.frequency.value = freq;\n      gain.gain.setValueAtTime(0.2, now + idx * 0.1);\n      gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.4);\n      osc.connect(gain);\n      gain.connect(this.ctx!.destination);\n      osc.start(now + idx * 0.1);\n      osc.stop(now + idx * 0.1 + 0.4);\n    });\n  }\n\n  // Korean Text-to-Speech narration\n  speak(text: string) {\n    if (!this.voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;\n    try {\n      window.speechSynthesis.cancel(); // Stop any pending speech\n      const utterance = new SpeechSynthesisUtterance(text);\n      utterance.lang = 'ko-KR';\n      utterance.rate = 1.05;\n      utterance.pitch = 1.1;\n      window.speechSynthesis.speak(utterance);\n    } catch {\n      // Graceful fallback if speech synthesis is blocked\n    }\n  }\n\n  stopVoice() {\n    if (typeof window !== 'undefined' && window.speechSynthesis) {\n      window.speechSynthesis.cancel();\n    }\n  }\n}\n\nexport const soundManager = new SoundManager();\n", "src/utils/storage.ts": "import { Achievement, GameScoreRecord, UserStats } from '../types';\n\nconst STATS_KEY = 'gas_safety_user_stats_v1';\nconst ACHIEVEMENTS_KEY = 'gas_safety_achievements_v1';\nconst LEADERBOARD_KEY = 'gas_safety_leaderboard_v1';\n\nexport const INITIAL_ACHIEVEMENTS: Achievement[] = [\n  {\n    id: 'survivor',\n    title: '오늘의 가스 안전 지킴이!',\n    description: '끝까지 포기하지 않고 안전하게 생존 클리어하기',\n    icon: 'ShieldCheck',\n    unlocked: false,\n    progress: 0,\n    maxProgress: 1,\n  },\n  {\n    id: 'expert_normal',\n    title: '가스안전 전문가',\n    description: '일반 모드에서 11,500점 이상 고득점 달성하기',\n    icon: 'Award',\n    unlocked: false,\n    progress: 0,\n    maxProgress: 11500,\n  },\n  {\n    id: 'master_hard',\n    title: '가스안전 마스터',\n    description: '하드 모드에서 15,500점 이상 고득점 달성하기',\n    icon: 'Crown',\n    unlocked: false,\n    progress: 0,\n    maxProgress: 15500,\n  },\n  {\n    id: 'prologue_15',\n    title: '안전 수칙을 꼼꼼하게!',\n    description: '가스안전 프롤로그를 총 15회 완벽하게 클리어하기',\n    icon: 'BookOpenCheck',\n    unlocked: false,\n    progress: 0,\n    maxProgress: 15,\n  },\n  {\n    id: 'hard_clear',\n    title: '가스 안전은 나에게 맡겨!',\n    description: '긴박한 하드 모드를 멋지게 클리어하기',\n    icon: 'FlameKindling',\n    unlocked: false,\n    progress: 0,\n    maxProgress: 1,\n  },\n];\n\nexport const INITIAL_STATS: UserStats = {\n  prologueClearCount: 0,\n  normalHighScore: 0,\n  hardHighScore: 0,\n  normalCleared: false,\n  hardCleared: false,\n  totalHazardsResolved: 0,\n  totalGamesPlayed: 0,\n};\n\nexport const storage = {\n  resetAllGameData(): { stats: UserStats; achievements: Achievement[] } {\n    try {\n      localStorage.removeItem(STATS_KEY);\n      localStorage.removeItem(ACHIEVEMENTS_KEY);\n      localStorage.removeItem(LEADERBOARD_KEY);\n    } catch {\n      // ignore\n    }\n    return {\n      stats: { ...INITIAL_STATS },\n      achievements: INITIAL_ACHIEVEMENTS.map(a => ({ ...a, unlocked: false, progress: 0, unlockedAt: undefined })),\n    };\n  },\n\n  getStats(): UserStats {\n    try {\n      const data = localStorage.getItem(STATS_KEY);\n      return data ? { ...INITIAL_STATS, ...JSON.parse(data) } : INITIAL_STATS;\n    } catch {\n      return INITIAL_STATS;\n    }\n  },\n\n  saveStats(stats: UserStats): void {\n    try {\n      localStorage.setItem(STATS_KEY, JSON.stringify(stats));\n    } catch {\n      // Ignore storage errors\n    }\n  },\n\n  getAchievements(): Achievement[] {\n    try {\n      const data = localStorage.getItem(ACHIEVEMENTS_KEY);\n      if (!data) return INITIAL_ACHIEVEMENTS;\n      const saved: Achievement[] = JSON.parse(data);\n      // Merge with latest schema in case of new achievements / updated targets\n      return INITIAL_ACHIEVEMENTS.map(initial => {\n        const found = saved.find(s => s.id === initial.id);\n        return found\n          ? {\n              ...initial,\n              unlocked: found.unlocked,\n              progress: found.progress,\n              unlockedAt: found.unlockedAt,\n            }\n          : initial;\n      });\n    } catch {\n      return INITIAL_ACHIEVEMENTS;\n    }\n  },\n\n  saveAchievements(achievements: Achievement[]): void {\n    try {\n      localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(achievements));\n    } catch {\n      // Ignore storage errors\n    }\n  },\n\n  getLeaderboard(): GameScoreRecord[] {\n    try {\n      const data = localStorage.getItem(LEADERBOARD_KEY);\n      if (data) return JSON.parse(data);\n      // Default sample records for experience classroom inspiration\n      const defaults: GameScoreRecord[] = [\n        {\n          id: 'def-1',\n          playerName: '안전지킴이 김민수',\n          score: 14500,\n          mode: 'normal',\n          cleared: true,\n          hazardsCleared: 28,\n          date: '2026-08-25',\n        },\n        {\n          id: 'def-2',\n          playerName: '가스박사 이서연',\n          score: 22400,\n          mode: 'hard',\n          cleared: true,\n          hazardsCleared: 42,\n          date: '2026-08-26',\n        },\n        {\n          id: 'def-3',\n          playerName: '소방꿈나무 박도현',\n          score: 11200,\n          mode: 'normal',\n          cleared: true,\n          hazardsCleared: 22,\n          date: '2026-08-24',\n        },\n      ];\n      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(defaults));\n      return defaults;\n    } catch {\n      return [];\n    }\n  },\n\n  addScoreRecord(record: Omit<GameScoreRecord, 'id' | 'date'>): GameScoreRecord[] {\n    const list = this.getLeaderboard();\n    const newRecord: GameScoreRecord = {\n      ...record,\n      id: 'rec-' + Date.now(),\n      date: new Date().toISOString().split('T')[0],\n    };\n    const updated = [...list, newRecord]\n      .sort((a, b) => b.score - a.score)\n      .slice(0, 20); // Keep top 20\n    try {\n      localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(updated));\n    } catch {\n      // ignore\n    }\n    return updated;\n  },\n\n  incrementPrologueClear(): { newCount: number; newlyUnlocked: Achievement[] } {\n    const stats = this.getStats();\n    stats.prologueClearCount += 1;\n    this.saveStats(stats);\n\n    const achievements = this.getAchievements();\n    const newlyUnlocked: Achievement[] = [];\n\n    const target = achievements.find(a => a.id === 'prologue_15');\n    if (target) {\n      target.progress = stats.prologueClearCount;\n      if (stats.prologueClearCount >= 15 && !target.unlocked) {\n        target.unlocked = true;\n        target.unlockedAt = new Date().toLocaleDateString('ko-KR');\n        newlyUnlocked.push(target);\n      }\n    }\n\n    this.saveAchievements(achievements);\n    return { newCount: stats.prologueClearCount, newlyUnlocked };\n  },\n\n  checkGameAchievements(\n    mode: 'normal' | 'hard',\n    score: number,\n    cleared: boolean,\n    hazardsCleared: number\n  ): { newlyUnlocked: Achievement[]; updatedStats: UserStats } {\n    const stats = this.getStats();\n    stats.totalGamesPlayed += 1;\n    stats.totalHazardsResolved += hazardsCleared;\n\n    if (mode === 'normal') {\n      stats.normalHighScore = Math.max(stats.normalHighScore, score);\n      if (cleared) stats.normalCleared = true;\n    } else {\n      stats.hardHighScore = Math.max(stats.hardHighScore, score);\n      if (cleared) stats.hardCleared = true;\n    }\n    this.saveStats(stats);\n\n    const achievements = this.getAchievements();\n    const newlyUnlocked: Achievement[] = [];\n\n    // 1. 오늘의 가스 안전 지킴이! (제한 시간 살아남을 시)\n    const survivorAch = achievements.find(a => a.id === 'survivor');\n    if (survivorAch && cleared && !survivorAch.unlocked) {\n      survivorAch.unlocked = true;\n      survivorAch.progress = 1;\n      survivorAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n      newlyUnlocked.push(survivorAch);\n    }\n\n    // 2. 가스안전 전문가 (일반 모드 11,500점 이상 달성)\n    const expertAch = achievements.find(a => a.id === 'expert_normal');\n    if (expertAch) {\n      expertAch.progress = Math.max(expertAch.progress, stats.normalHighScore);\n      if (mode === 'normal' && score >= 11500 && !expertAch.unlocked) {\n        expertAch.unlocked = true;\n        expertAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n        newlyUnlocked.push(expertAch);\n      }\n    }\n\n    // 3. 가스안전 마스터 (하드 모드 15,500점 이상 달성)\n    const masterAch = achievements.find(a => a.id === 'master_hard');\n    if (masterAch) {\n      masterAch.progress = Math.max(masterAch.progress, stats.hardHighScore);\n      if (mode === 'hard' && score >= 15500 && !masterAch.unlocked) {\n        masterAch.unlocked = true;\n        masterAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n        newlyUnlocked.push(masterAch);\n      }\n    }\n\n    // 5. 가스 안전은 나에게 맡겨! (하드모드 클리어)\n    const hardClearAch = achievements.find(a => a.id === 'hard_clear');\n    if (hardClearAch && mode === 'hard' && cleared && !hardClearAch.unlocked) {\n      hardClearAch.unlocked = true;\n      hardClearAch.progress = 1;\n      hardClearAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n      newlyUnlocked.push(hardClearAch);\n    }\n\n    this.saveAchievements(achievements);\n    return { newlyUnlocked, updatedStats: stats };\n  },\n};\n", "src/types.ts": "export type GameMode = 'menu' | 'prologue' | 'normal' | 'hard';\n\nexport type GameStatus = 'idle' | 'playing' | 'gameover' | 'victory';\n\nexport type HazardType = \n  | 'valve'          // 1. 가스 밸브 잠그기 (\"가스가 새면 위험하기 때문\")\n  | 'window'         // 2. 창문 열기 (\"가스 때문에 환기를 시켜야하기 때문\")\n  | 'flammables'     // 3. 가스레인지 주변 가연물 치우기 (\"가연성 물품을 불 근처에 두는건 위험해\")\n  | 'cleaning'       // 4. 가스레인지 주변 청소하기 (\"주변이 더러우면 불이 붙을 수도 있어\")\n  | 'old_valve_call' // 5. 노후 가스 밸브 전문가에게 전화하기 (\"오래된 것은 방심하면 큰 불이 일어날 수 있어\")\n  | 'hose_kink';     // 6. 눌린 가스 호스 펴주기 (\"누르거나 꺾이지 않게 하자\")\n\nexport interface ActiveHazard {\n  id: string;\n  type: HazardType;\n  timeLeft: number;      // remaining time in seconds\n  totalTime: number;     // initial time limit (10s normal / 5s hard)\n  spawnedAt: number;     // timestamp\n  flammablesCount?: number; // for flammables: 4 items to clear\n  windowClickCount?: number; // for window: 2 clicks to fully open\n  phoneCallPending?: boolean; // phone call in progress\n  cleaningToolSelected?: boolean; // for cleaning: dishcloth selected\n}\n\nexport interface HazardConfig {\n  type: HazardType;\n  title: string;\n  actionInstruction: string;\n  reason: string;\n  locationDescription: string;\n  educationalTip: string;\n  iconName: string;\n  color: string;\n}\n\nexport interface Achievement {\n  id: string;\n  title: string;\n  description: string;\n  icon: string;\n  unlocked: boolean;\n  unlockedAt?: string;\n  progress: number;\n  maxProgress: number;\n}\n\nexport interface GameScoreRecord {\n  id: string;\n  playerName: string;\n  score: number;\n  mode: 'normal' | 'hard';\n  cleared: boolean;\n  hazardsCleared: number;\n  date: string;\n}\n\nexport interface UserStats {\n  prologueClearCount: number;\n  normalHighScore: number;\n  hardHighScore: number;\n  normalCleared: boolean;\n  hardCleared: boolean;\n  totalHazardsResolved: number;\n  totalGamesPlayed: number;\n}\n"}</script>
    <script>
      const ORIGINAL_FILES = JSON.parse(document.getElementById('embedded-sources').textContent);
      const compiled = new Map();
      const sourceNames = Object.keys(ORIGINAL_FILES);

      function normalize(path) {
        const parts = path.split('/');
        const out = [];
        for (const part of parts) {
          if (!part || part === '.') continue;
          if (part === '..') out.pop(); else out.push(part);
        }
        return out.join('/');
      }

      function resolveImport(from, spec) {
        if (!spec.startsWith('.')) return null;
        const base = from.slice(0, from.lastIndexOf('/') + 1);
        const candidate = normalize(base + spec);
        const candidates = [candidate, candidate + '.ts', candidate + '.tsx', candidate + '.js', candidate + '.jsx', candidate + '/index.ts', candidate + '/index.tsx'];
        return candidates.find(x => ORIGINAL_FILES[x]) || null;
      }

      for (const name of sourceNames) {
        compiled.set(name, ts.transpileModule(ORIGINAL_FILES[name], {
          compilerOptions: {
            target: ts.ScriptTarget.ES2020,
            module: ts.ModuleKind.ESNext,
            jsx: ts.JsxEmit.ReactJSX,
            esModuleInterop: true,
            sourceMap: false,
            removeComments: false,
            useDefineForClassFields: true
          },
          fileName: name
        }).outputText);
      }

      // The original CSS is embedded above, so the original main.tsx stylesheet side-effect import is satisfied here.
      function rewriteImports(from, code, resolver) {
        code = code.replace(/import\s*["']\.\/index\.css["']\s*;?/g, '');
        code = code.replace(/(from\s*["'])(\.[^"']+)(["'])/g, (m, pre, spec, post) => {
          const target = resolveImport(from, spec);
          return target ? pre + resolver(target) + post : m;
        });
        code = code.replace(/(import\s*["'])(\.[^"']+)(["'])/g, (m, pre, spec, post) => {
          const target = resolveImport(from, spec);
          return target ? pre + resolver(target) + post : m;
        });
        return code;
      }

      const moduleUrls = new Map();
      const building = new Set();
      function makeModule(name) {
        if (moduleUrls.has(name)) return moduleUrls.get(name);
        if (building.has(name)) throw new Error('Unexpected circular dependency: ' + name);

        moduleUrls.set(name, url);
        building.delete(name);
