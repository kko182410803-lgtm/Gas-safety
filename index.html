    </script><style id="original-index-css">@import "tailwindcss";@layer base{body{font-family:'Noto Sans KR',sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}}.font-game{font-family:'Jua','Noto Sans KR',sans-serif;}@keyframes floatSmoke{0%{transform:translateY(0px) scale(0.8);opacity:0.8;}50%{transform:translateY(-15px) scale(1.1) translateX(5px);opacity:0.6;}100%{transform:translateY(-30px) scale(1.4) translateX(-5px);opacity:0;}}@keyframes pulseGlow{0%,100%{box-shadow:0 0 15px rgba(239,68,68,0.7);}50%{box-shadow:0 0 30px rgba(239,68,68,1),0 0 45px rgba(245,158,11,0.8);}}@keyframes gentleBreeze{0%{transform:rotate(0deg);}50%{transform:rotate(2deg) translateY(-2px);}100%{transform:rotate(0deg);}}@keyframes pendulumSwing{0%{transform:rotate(-12deg);}50%{transform:rotate(12deg);}100%{transform:rotate(-12deg);}}.animate-smoke{animation:floatSmoke 2s infinite ease-out;}.animate-hazard-glow{animation:pulseGlow 1.2s infinite;}.animate-breeze{animation:gentleBreeze 3s infinite ease-in-out;}.animate-pendulum{animation:pendulumSwing 2s infinite ease-in-out;transform-origin:top center;}.safety-tip-title{font-family:Gulim,"Malgun Gothic",sans-serif;font-weight:600;letter-spacing:-0.01em;white-space:normal;overflow-wrap:anywhere;line-height:1.35;}.safety-tip-label{font-family:Gulim,"Malgun Gothic",sans-serif;font-weight:600;line-height:1.35;}</style><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><style id="mobile-responsive-fix">html,body,#root{width:100%;min-height:100%;margin:0;}@media (max-width:1024px) and (orientation:landscape){html,body{overflow:hidden;}}</style><style id="startup-portrait-warning-style">#startup-portrait-warning{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;padding:22px;box-sizing:border-box;background:#0b1220;}#startup-portrait-warning .startup-warning-panel{width:min(92vw,720px);box-sizing:border-box;padding:32px 28px;border:3px solid rgba(251,191,36 g-slate-900 text-slate-100 select-none overflow-x-hidden font-sans"><div id="root"></div><div id="startup-thumbnail" role="dialog" aria-label="게임 시작"><div id="startup-portrait-warning" aria-live="assertive"><div class="startup-warning-panel"><h2 class="startup-warning-title">휴대폰으로 접속하셨습니다</h2><p class="startup-warning-text">게임을 시작하기 전에 <span class="startup-warning-strong">휴대폰을 가로로 돌려주세요.</span><br />가로 화면에서 휴대폰 전용 화면으로 조절됩니다.</p></div></div><div class="thumbnail-frame"><img alt="가스 안전 지키기 게임 미리보기" src="./가스안전 지키기.png" draggable="false" /><button type="button" id="startup-thumbnail-start">터치 후 시작하기</button></div></div><script id="startup-thumbnail-script">
      (function () {

        function isPortraitMobile() {
          var touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

          return mobile && window.innerHeight > window.innerWidth;

        start.addEventListener('click', closeSplash);

    <script id="embedded-sources" type="application/json">{"src/main.tsx":"import { jsx as _jsx } from \"react/jsx-runtime\";\nimport { StrictMode } from 'react';\nimport { createRoot } from 'react-dom/client';\nimport App from './App.tsx';\nimport './index.css';\ncreateRoot(document.getElementById('root')).render(_jsx(StrictMode, { children: _jsx(App, {}) }));\n","src/App.tsx":"import { jsx as _jsx, Fragment as _Fragment, jsxs as _jsxs } from \"react/jsx-runtime\";\nimport { useState, useEffect, useRef, useCallback } from 'react';\nimport { KitchenScene } from './components/KitchenScene';\nimport { GameHUD } from './components/GameHUD';\nimport { PrologueModal } from './components/PrologueModal';\nimport { AchievementsModal } from './components/AchievementsModal';\nimport { GameOverModal } from './components/GameOverModal';\nimport { SafetyTipsModal } from './components/SafetyTipsModal';\nimport { storage } from './utils/storage';\nimport { soundManager } from './utils/audio';\nimport { Flame, Play, BookOpen, Trophy, ShieldCheck, Volume2, VolumeX, Mic, MicOff, Maximize2, Smartphone, Sparkles, Award, Lock, RotateCcw, AlertTriangle, CheckCircle2 } from 'lucide-react';\nimport { motion } from 'motion/react';\nimport confetti from 'canvas-confetti';\nconst NORMAL_GAME_TIME = 120;\nconst HARD_GAME_TIME = 150;\nconst ALL_HAZARD_TYPES = [\n    'valve',\n    'window',\n    'flammables',\n    'cleaning',\n    'old_valve_call',\n    'hose_kink',\n];\nexport default function App() {\n    const [mode, setMode] = useState('menu');\n    const [status, setStatus] = useState('idle');\n    const [score, setScore] = useState(0);\n    const [timeLeft, setTimeLeft] = useState(NORMAL_GAME_TIME);\n    const [combo, setCombo] = useState(0);\n    const [hazardsClearedCount, setHazardsClearedCount] = useState(0);\n    const [activeHazards, setActiveHazards] = useState([]);\n    const [stats, setStats] = useState(storage.getStats());\n    const [achievements, setAchievements] = useState(storage.getAchievements());\n    const [newlyUnlocked, setNewlyUnlocked] = useState([]);\n    const [isPrologueOpen, setIsPrologueOpen] = useState(false);\n    const [prologueResetKey, setPrologueResetKey] = useState(0);\n    const [isAchievementsOpen, setIsAchievementsOpen] = useState(false);\n    const [isSafetyTipsOpen, setIsSafetyTipsOpen] = useState(false);\n    const [isRulesOpen, setIsRulesOpen] = useState(false);\n    const [isFirstPrologueSafetyPrompt, setIsFirstPrologueSafetyPrompt] = useState(false);\n    const [pendingNormalStart, setPendingNormalStart] = useState(false);\n    const [isResetConfirmOpen, setIsResetConfirmOpen] = useState(false);\n    const [resetToast, setResetToast] = useState(false);\n    const [soundEnabled, setSoundEnabled] = useState(true);\n    const [voiceEnabled, setVoiceEnabled] = useState(true);\n    const [isFullscreen, setIsFullscreen] = useState(false);\n    const [isMobileDevice, setIsMobileDevice] = useState(() => {\n        if (typeof window === 'undefined')\n            return false;\n        return ('ontouchstart' in window || navigator.maxTouchPoints > 0) && Math.max(window.innerWidth, window.innerHeight) <= 1024;\n    });\n    const [isMobileLayout, setIsMobileLayout] = useState(false);\n    const [mobileNoticeDismissed, setMobileNoticeDismissed] = useState(false);\n    const [mobileGameScale, setMobileGameScale] = useState(1);\n    const [desktopFullscreenScale, setDesktopFullscreenScale] = useState(1);\n    const [isPortraitMobile, setIsPortraitMobile] = useState(false);\n    const [floatingScore, setFloatingScore] = useState(null);\n    const [dishclothSelected, setDishclothSelected] = useState(false);\n    const [storyQueue, setStoryQueue] = useState(() => {\n        try { return window.__gasSafetyStartupStarted ? ['opening'] : []; }\n        catch { return []; }\n    });\n    const [activeStory, setActiveStory] = useState(null);\n    const containerRef = useRef(null);\n    const respawnCooldownTimer = useRef(0);\n    const recentHazardTypesRef = useRef([]);\n    useEffect(() => {\n        const onStartup = () => setStoryQueue(q => q.includes('opening') ? q : [...q, 'opening']);\n        window.addEventListener('gas-safety-startup', onStartup);\n        return () => window.removeEventListener('gas-safety-startup', onStartup);\n    }, []);\n    useEffect(() => {\n        if (!activeStory && storyQueue.length > 0) {\n            setActiveStory(storyQueue[0]);\n            setStoryQueue(q => q.slice(1));\n        }\n    }, [storyQueue, activeStory]);\n    const queueStory = (kind) => setStoryQueue(q => q.includes(kind) || activeStory === kind ? q : [...q, kind]);\n    const closeStory = () => setActiveStory(null);\n    useEffect(() => {\n        soundManager.soundEnabled = soundEnabled;\n    }, [soundEnabled]);\n    useEffect(() => {\n        soundManager.voiceEnabled = voiceEnabled;\n    }, [voiceEnabled]);\n    const toggleFullscreen = async () => {\n        try {\n            if (document.fullscreenElement) {\n                if (document.exitFullscreen)\n                    await document.exitFullscreen();\n                setIsFullscreen(false);\n                return;\n            }\n            const target = containerRef.current || document.documentElement;\n            const request = target.requestFullscreen || document.documentElement.requestFullscreen;\n            if (request) {\n                await request.call(target);\n                setIsFullscreen(true);\n            }\n            else {\n                setIsFullscreen(true);\n            }\n        }\n        catch (err) {\n            setIsFullscreen(prev => !prev);\n        }\n    };\n    useEffect(() => {\n        const syncFullscreenState = () => {\n            setIsFullscreen(!!document.fullscreenElement);\n        };\n        document.addEventListener('fullscreenchange', syncFullscreenState);\n        return () => document.removeEventListener('fullscreenchange', syncFullscreenState);\n    }, []);\n    useEffect(() => {\n        const updateDeviceType = () => {\n            const touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;\n            const mobile = touch && Math.max(window.innerWidth, window.innerHeight) <= 1024;\n            setIsMobileDevice(mobile);\n            setIsPortraitMobile(mobile && window.innerHeight > window.innerWidth);\n        };\n        window.addEventListener('resize', updateDeviceType);\n        window.addEventListener('orientationchange', updateDeviceType);\n        updateDeviceType();\n        return () => {\n            window.removeEventListener('resize', updateDeviceType);\n            window.removeEventListener('orientationchange', updateDeviceType);\n        };\n    }, []);\n    useEffect(() => {\n        const updateDisplayScale = () => {\n            if (typeof window === 'undefined')\n                return;\n            const baseWidth = 1500;\n            const baseHeight = 844;\n            const viewportWidth = Math.max(1, window.innerWidth);\n            const viewportHeight = Math.max(1, window.innerHeight);\n            if (isMobileLayout) {\n                const fitWidthScale = (viewportWidth - 16) / baseWidth;\n                const fitHeightScale = (viewportHeight - 16) / baseHeight;\n                const scale = Math.min(fitWidthScale, fitHeightScale);\n                const oneCmScale = fitHeightScale <= fitWidthScale ? (37.7952756 / baseHeight) : (37.7952756 / baseWidth);\n                setMobileGameScale(Math.max(0.25, Math.min(1, scale * 1.10 - oneCmScale)));\n            }\n            else {\n                setMobileGameScale(1);\n            }\n            if (isFullscreen && !isMobileLayout) {\n                const scale = Math.min(viewportWidth / baseWidth, viewportHeight / baseHeight);\n                setDesktopFullscreenScale(Math.max(0.25, Math.min(1, scale)));\n            }\n            else {\n                setDesktopFullscreenScale(1);\n            }\n        };\n        updateDisplayScale();\n        window.addEventListener('resize', updateDisplayScale);\n        window.addEventListener('orientationchange', updateDisplayScale);\n        return () => {\n            window.removeEventListener('resize', updateDisplayScale);\n            window.removeEventListener('orientationchange', updateDisplayScale);\n        };\n    }, [isMobileLayout, isFullscreen]);\n    const spawnHazard = useCallback((currentList, selectedMode) => {\n        if (currentList.length >= 3)\n            return currentList;\n        const activeTypes = new Set(currentList.map(h => h.type));\n        let availableTypes = ALL_HAZARD_TYPES.filter(t => !activeTypes.has(t) && !recentHazardTypesRef.current.includes(t));\n        if (availableTypes.length === 0) {\n            availableTypes = ALL_HAZARD_TYPES.filter(t => !activeTypes.has(t));\n        }\n        if (availableTypes.length === 0)\n            return currentList;\n        const randomType = availableTypes[Math.floor(Math.random() * availableTypes.length)];\n        recentHazardTypesRef.current = [...recentHazardTypesRef.current, randomType].slice(-2);\n        const timeLimit = selectedMode === 'hard' ? 5.5 : 12.0;\n        soundManager.playHazardWarning();\n        const newHazard = {\n            id: `${randomType}-${Date.now()}-${Math.random()}`,\n            type: randomType,\n            timeLeft: timeLimit,\n            totalTime: timeLimit,\n            spawnedAt: Date.now(),\n            flammablesCount: randomType === 'flammables' ? 4 : undefined,\n            windowClickCount: randomType === 'window' ? 2 : undefined,\n        };\n        return [...currentList, newHazard];\n    }, []);\n    const requestNormalGame = useCallback(() => {\n        let seen = false;\n        try {\n            seen = localStorage.getItem('gas_safety_normal_rules_seen_v2') === '1';\n        }\n        catch { }\n        if (!seen) {\n            setPendingNormalStart(true);\n            setIsRulesOpen(true);\n        }\n        else {\n            startGame('normal');\n        }\n    }, []);\n    const startGame = useCallback((chosenMode) => {\n        setMode(chosenMode);\n        setStatus('playing');\n        setScore(0);\n        setTimeLeft(chosenMode === 'normal' ? NORMAL_GAME_TIME : HARD_GAME_TIME);\n        setCombo(0);\n        setHazardsClearedCount(0);\n        setNewlyUnlocked([]);\n        setDishclothSelected(false);\n        respawnCooldownTimer.current = 0;\n        recentHazardTypesRef.current = [];\n        const initialList = spawnHazard([], chosenMode);\n        setActiveHazards(initialList);\n    }, [spawnHazard]);\n    const handleEndGame = useCallback((finalStatus, currentScore, clearedHazards, currentMode) => {\n        const previousStats = storage.getStats();\n        setStatus(finalStatus);\n        setActiveHazards([]);\n        if (finalStatus === 'victory') {\n            soundManager.playVictory();\n            try {\n                confetti({\n                    particleCount: 120,\n                    spread: 80,\n                    origin: { y: 0.6 },\n                });\n            }\n            catch {\n            }\n        }\n        else {\n            soundManager.playFailure();\n        }\n        if (currentMode === 'normal' || currentMode === 'hard') {\n            const result = storage.checkGameAchievements(currentMode, currentScore, finalStatus === 'victory', clearedHazards);\n            setStats(result.updatedStats);\n            setAchievements(storage.getAchievements());\n            if (result.newlyUnlocked.length > 0) {\n                setNewlyUnlocked(result.newlyUnlocked);\n                soundManager.playAchievement();\n            }\n            const latestAchievements = storage.getAchievements();\n            if (finalStatus === 'victory' && currentMode === 'hard' && !previousStats.hardCleared) {\n                let shown = false;\n                try { shown = localStorage.getItem('gas_safety_first_hard_story_v1') === '1'; } catch {}\n                if (!shown) {\n                    try { localStorage.setItem('gas_safety_first_hard_story_v1', '1'); } catch {}\n                    queueStory('hard');\n                }\n            }\n            if (finalStatus === 'victory' && latestAchievements.length > 0 && latestAchievements.every(a => a.unlocked)) {\n                let shown = false;\n                try { shown = localStorage.getItem('gas_safety_all_achievements_story_v1') === '1'; } catch {}\n                if (!shown) {\n                    try { localStorage.setItem('gas_safety_all_achievements_story_v1', '1'); } catch {}\n                    queueStory('all');\n                }\n            }\n        }\n    }, [queueStory]);\n    useEffect(() => {\n        if (status !== 'playing')\n            return;\n        const interval = setInterval(() => {\n            setTimeLeft((prevTime) => {\n                const nextTime = Math.max(0, prevTime - 0.1);\n                if (nextTime <= 0) {\n                    handleEndGame('victory', score, hazardsClearedCount, mode);\n                }\n                return nextTime;\n            });\n            setActiveHazards((prevHazards) => {\n                let scorePenalty = 0;\n                let comboBroken = false;\n                const updatedList = [];\n                prevHazards.forEach((hazard) => {\n                    const nextHazardTime = hazard.timeLeft - 0.1;\n                    if (nextHazardTime <= 0) {\n                        scorePenalty -= 100;\n                        comboBroken = true;\n                        soundManager.playFailure();\n                    }\n                    else {\n                        updatedList.push({\n                            ...hazard,\n                            timeLeft: nextHazardTime,\n                        });\n                    }\n                });\n                if (scorePenalty < 0) {\n                    setScore((s) => {\n    }\n    }\n    playSuccess(combo = 1) {\n        if (!this.soundEnabled)\n            return;\n        this.initCtx();\n        if (!this.ctx)\n            return;\n        const baseFreq = 523.25;\n        const pitchMultiplier = Math.min(1.5, 1 + (combo - 1) * 0.08);\n        const now = this.ctx.currentTime;\n        const osc = this.ctx.createOscillator();\n        const gain = this.ctx.createGain();\n        osc.type = 'triangle';\n        osc.frequency.setValueAtTime(baseFreq * pitchMultiplier, now);\n        osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5 * pitchMultiplier, now + 0.15);\n        gain.gain.setValueAtTime(0.3, now);\n        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);\n        osc.connect(gain);\n        gain.connect(this.ctx.destination);\n        osc.start(now);\n        osc.stop(now + 0.3);\n        const sparkleOsc = this.ctx.createOscillator();\n        const sparkleGain = this.ctx.createGain();\n        sparkleOsc.type = 'sine';\n        sparkleOsc.frequency.setValueAtTime(1046.5 * pitchMultiplier, now + 0.05);\n        sparkleOsc.frequency.exponentialRampToValueAtTime(1318.5 * pitchMultiplier, now + 0.25);\n        sparkleGain.gain.setValueAtTime(0.2, now + 0.05);\n        sparkleGain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);\n        sparkleOsc.connect(sparkleGain);\n        sparkleGain.connect(this.ctx.destination);\n        sparkleOsc.start(now + 0.05);\n        sparkleOsc.stop(now + 0.3);\n    }\n    playValveTurn() {\n        if (!this.soundEnabled)\n            return;\n        this.initCtx();\n        if (!this.ctx)\n            return;\n        const now = this.ctx.currentTime;\n        const osc = this.ctx.createOscillator();\n        const gain = this.ctx.createGain();\n        osc.type = 'square';\n        osc.frequency.setValueAtTime(180, now);\n        osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);\n        gain.gain.setValueAtTime(0.4, now);\n        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);\n        osc.connect(gain);\n        gain.connect(this.ctx.destination);\n        osc.start(now);\n        osc.stop(now + 0.12);\n    }\n    playWindowWhoosh() {\n        if (!this.soundEnabled)\n            return;\n        this.initCtx();\n        if (!this.ctx)\n            return;\n        const now = this.ctx.currentTime;\n        const bufferSize = this.ctx.sampleRate * 0.25;\n        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);\n        const data = buffer.getChannelData(0);\n        for (let i = 0; i < bufferSize; i++) {\n            data[i] = Math.random() * 2 - 1;\n        }\n        const noise = this.ctx.createBufferSource();\n        noise.buffer = buffer;\n        const filter = this.ctx.createBiquadFilter();\n        filter.type = 'bandpass';\n        filter.frequency.setValueAtTime(400, now);\n        filter.frequency.exponentialRampToValueAtTime(1200, now + 0.2);\n        const gain = this.ctx.createGain();\n        gain.gain.setValueAtTime(0.25, now);\n        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);\n        noise.connect(filter);\n        filter.connect(gain);\n        gain.connect(this.ctx.destination);\n        noise.start(now);\n        noise.stop(now + 0.25);\n    }\n    playWipe() {\n        if (!this.soundEnabled)\n            return;\n        this.initCtx();\n        if (!this.ctx)\n            return;\n        const now = this.ctx.currentTime;\n        const osc = this.ctx.createOscillator();\n        const gain = this.ctx.createGain();\n        osc.type = 'sine';\n        osc.frequency.setValueAtTime(900, now);\n        osc.frequency.linearRampToValueAtTime(1400, now + 0.08);\n        osc.frequency.linearRampToValueAtTime(1100, now + 0.16);\n        gain.gain.setValueAtTime(0.2, now);\n        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);\n        osc.connect(gain);\n        gain.connect(this.ctx.destination);\n        osc.start(now);\n        osc.st        osc.connect(gain);\n        gain.connect(this.ctx.destination);\n        osc.start(now);\n        osc.stop(now + 0.2);\n    }\n    playVictory() {\n        if (!this.soundEnabled)\n            return;\n        this.initCtx();\n        if (!this.ctx)\n            return;\n        const now = this.ctx.currentTime;\n        const melody = [\n            { note: 523.25, time: 0, dur: 0.15 },\n            { note: 659.25, time: 0.15, dur: 0.15 },\n            { note: 783.99, time: 0.3, dur: 0.15 },\n            { note: 1046.5, time: 0.45, dur: 0.4 },\n        ];\n        melody.forEach(m => {\n            const osc = this.ctx.createOscillator();\n            const gain = this.ctx.createGain();\n            osc.type = 'triangle';\n            osc.frequency.setValueAtTime(m.note, now + m.time);\n            gain.gain.setValueAtTime(0.25, now + m.time);\n            gain.gain.exponentialRampToValueAtTime(0.01, now + m.time + m.dur);\n            osc.connect(gain);\n            gain.connect(this.ctx.destination);\n            osc.start(now + m.time);\n            osc.stop(now + m.time + m.dur);\n        });\n    }\n    playAchievement() {\n        if (!this.soundEnabled)\n            return;\n        this.initCtx();\n        if (!this.ctx)\n            return;\n        const now = this.ctx.currentTime;\n        [784, 987.77, 1174.66, 1567.98].forEach((freq, idx) => {\n            const osc = this.ctx.createOscillator();\n            const gain = this.ctx.createGain();\n            osc.type = 'sine';\n            osc.frequency.value = freq;\n            gain.gain.setValueAtTime(0.2, now + idx * 0.1);\n            gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.4);\n            osc.connect(gain);\n            gain.connect(this.ctx.destination);\n            osc.start(now + idx * 0.1);\n            osc.stop(now + idx * 0.1 + 0.4);\n        });\n    }\n    speak(text) {\n        if (!this.voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis)\n            return;\n        try {\n            window.speechSynthesis.cancel();\n            const utterance = new SpeechSynthesisUtterance(text);\n            utterance.lang = 'ko-KR';\n            utterance.rate = 1.05;\n            utterance.pitch = 1.1;\n            window.speechSynthesis.speak(utterance);\n        }\n        catch {\n        }\n    }\n    stopVoice() {\n        if (typeof window !== 'undefined' && window.speechSynthesis) {\n            window.speechSynthesis.cancel();\n        }\n    }\n}\nexport const soundManager = new SoundManager();\n","src/utils/storage.ts":"const STATS_KEY = 'gas_safety_user_stats_v1';\nconst ACHIEVEMENTS_KEY = 'gas_safety_achievements_v1';\nconst LEADERBOARD_KEY = 'gas_safety_leaderboard_v1';\nexport const INITIAL_ACHIEVEMENTS = [\n    {\n        id: 'survivor',\n        title: '오늘의 가스 안전 지킴이!',\n        description: '끝까지 포기하지 않고 안전하게 생존 클리어하기',\n        icon: 'ShieldCheck',\n        unlocked: false,\n        progress: 0,\n        maxProgress: 1,\n    },\n    {\n        id: 'expert_normal',\n        title: '가스안전 전문가',\n        description: '일반 모드에서 3,000점 이상 고득점 달성하기',\n        icon: 'Award',\n        unlocked: false,\n        progress: 0,\n        maxProgress: 3000,\n    },\n    {\n        id: 'master_hard',\n        title: '가스안전 마스터',\n        description: '하드 모드에서 16,000점 이상 고득점 달성하기',\n        icon: 'Crown',\n        unlocked: false,\n        progress: 0,\n        maxProgress: 16000,\n    },\n    {\n        id: 'prologue_15',\n        title: '안전 수칙 외우기!',\n        description: '가스안전 프롤로그를 총 15회 완벽하게 클리어하기',\n        icon: 'BookOpenCheck',\n        unlocked: false,\n        progress: 0,\n        maxProgress: 15,\n    },\n    {\n        id: 'hard_clear',\n        title: '가스 안전은 나에게 맡겨!',\n        description: '긴박한 하드 모드를 멋지게 클리어하기',\n        icon: 'FlameKindling',\n        unlocked: false,\n        progress: 0,\n        maxProgress: 1,\n    },\n];\nexport const INITIAL_STATS = {\n    prologueClearCount: 0,\n    normalHighScore: 0,\n    hardHighScore: 0,\n    normalCleared: false,\n    hardCleared: false,\n    totalHazardsResolved: 0,\n    totalGamesPlayed: 0,\n};\nexport const storage = {\n    resetAllGameData() {\n        try {\n            localStorage.removeItem(STATS_KEY);\n            localStorage.removeItem(ACHIEVEMENTS_KEY);\n            localStorage.removeItem(LEADERBOARD_KEY);\n        }\n        catch {\n        }\n        return {\n            stats: { ...INITIAL_STATS },\n            achievements: INITIAL_ACHIEVEMENTS.map(a => ({ ...a, unlocked: false, progress: 0, unlockedAt: undefined })),\n        };\n    },\n    getStats() {\n        try {\n            const data = localStorage.getItem(STATS_KEY);\n            return data ? { ...INITIAL_STATS, ...JSON.parse(data) } : INITIAL_STATS;\n        }\n        catch {\n            return INITIAL_STATS;\n        }\n    },\n    saveStats(stats) {\n        try {\n            localStorage.setItem(STATS_KEY, JSON.stringify(stats));\n        }\n        catch {\n        }\n    },\n    getAchievements() {\n        try {\n            const data = localStorage.getItem(ACHIEVEMENTS_KEY);\n            if (!data)\n                return INITIAL_ACHIEVEMENTS;\n            const saved = JSON.parse(data);\n            const currentStats = this.getStats();\n            return INITIAL_ACHIEVEMENTS.map(initial => {\n                const found = saved.find(s => s.id === initial.id);\n                if (!found)\n                    return initial;\n                if (initial.id === 'expert_normal') {\n                    const progress = currentStats.normalHighScore;\n                    return { ...initial, unlocked: progress >= 3000, progress, unlockedAt: progress >= 3000 ? found.unlockedAt : undefined };\n                }\n                if (initial.id === 'master_hard') {\n                    const progress = currentStats.hardHighScore;\n                    return { ...initial, unlocked: progress >= 16000, progress, unlockedAt: progress >= 16000 ? found.unlockedAt : undefined };\n                }\n                return { ...initial, unlocked: found.unlocked, progress: found.progress, unlockedAt: found.unlockedAt };\n            });\n        }\n        catch {\n            return INITIAL_ACHIEVEMENTS;\n        }\n    },\n    saveAchievements(achievements) {\n        try {\n            localStorage.setItem(ACHIEVEMENTS_KEY, JSON.stringify(achievements));\n        }\n        catch {\n        }\n    },\n    getLeaderboard() {\n        try {\n            const data = localStorage.getItem(LEADERBOARD_KEY);\n            if (data)\n                return JSON.parse(data);\n            const defaults = [\n                {\n                    id: 'def-1',\n                    playerName: '안전지킴이 김민수',\n                    score: 14500,\n                    mode: 'normal',\n                    cleared: true,\n                    hazardsCleared: 28,\n                    date: '2026-08-25',\n                },\n                {\n                    id: 'def-2',\n                    playerName: '가스박사 이서연',\n                    score: 22400,\n                    mode: 'hard',\n                    cleared: true,\n                    hazardsCleared: 42,\n                    date: '2026-08-26',\n                },\n                {\n                    id: 'def-3',\n                    playerName: '소방꿈나무 박도현',\n                    score: 11200,\n                    mode: 'normal',\n                    cleared: true,\n                    hazardsCleared: 22,\n                    date: '2026-08-24',\n                },\n            ];\n            localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(defaults));\n            return defaults;\n        }\n        catch {\n            return [];\n        }\n    },\n    addScoreRecord(record) {\n        const list = this.getLeaderboard();\n        const newRecord = {\n            ...record,\n            id: 'rec-' + Date.now(),\n            date: new Date().toISOString().split('T')[0],\n        };\n        const updated = [...list, newRecord]\n            .sort((a, b) => b.score - a.score)\n            .slice(0, 20);\n        try {\n            localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(updated));\n        }\n        catch {\n        }\n        return updated;\n    },\n    incrementPrologueClear() {\n        const stats = this.getStats();\n        stats.prologueClearCount += 1;\n        this.saveStats(stats);\n        const achievements = this.getAchievements();\n        const newlyUnlocked = [];\n        const target = achievements.find(a => a.id === 'prologue_15');\n        if (target) {\n            target.progress = stats.prologueClearCount;\n            if (stats.prologueClearCount >= 15 && !target.unlocked) {\n                target.unlocked = true;\n                target.unlockedAt = new Date().toLocaleDateString('ko-KR');\n                newlyUnlocked.push(target);\n            }\n        }\n        this.saveAchievements(achievements);\n        return { newCount: stats.prologueClearCount, newlyUnlocked };\n    },\n    checkGameAchievements(mode, score, cleared, hazardsCleared) {\n        const stats = this.getStats();\n        stats.totalGamesPlayed += 1;\n        stats.totalHazardsResolved += hazardsCleared;\n        if (mode === 'normal') {\n            stats.normalHighScore = Math.max(stats.normalHighScore, score);\n            if (cleared)\n                stats.normalCleared = true;\n        }\n        else {\n            stats.hardHighScore = Math.max(stats.hardHighScore, score);\n            if (cleared)\n                stats.hardCleared = true;\n        }\n        this.saveStats(stats);\n        const achievements = this.getAchievements();\n        const newlyUnlocked = [];\n        const survivorAch = achievements.find(a => a.id === 'survivor');\n        if (survivorAch && cleared && !survivorAch.unlocked) {\n            survivorAch.unlocked = true;\n            survivorAch.progress = 1;\n            survivorAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n            newlyUnlocked.push(survivorAch);\n        }\n        const expertAch = achievements.find(a => a.id === 'expert_normal');\n        if (expertAch) {\n            expertAch.progress = stats.normalHighScore;\n            if (mode === 'normal' && score >= 3000 && !expertAch.unlocked) {\n                expertAch.unlocked = true;\n                expertAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n                newlyUnlocked.push(expertAch);\n            }\n        }\n        const masterAch = achievements.find(a => a.id === 'master_hard');\n        if (masterAch) {\n            masterAch.progress = stats.hardHighScore;\n            if (mode === 'hard' && score >= 16000 && !masterAch.unlocked) {\n                masterAch.unlocked = true;\n                masterAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n                newlyUnlocked.push(masterAch);\n            }\n        }\n        const hardClearAch = achievements.find(a => a.id === 'hard_clear');\n        if (hardClearAch && mode === 'hard' && cleared && !hardClearAch.unlocked) {\n            hardClearAch.unlocked = true;\n            hardClearAch.progress = 1;\n            hardClearAch.unlockedAt = new Date().toLocaleDateString('ko-KR');\n            newlyUnlocked.push(hardClearAch);\n        }\n        this.saveAchievements(achievements);\n        return { newlyUnlocked, updatedStats: stats };\n    },\n};\n","src/types.ts":"export {};\n"}</script>
